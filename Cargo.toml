[package]
authors = ["hill <hill@hilll.dev>"]
description = "A fetch program that shows your Vulkan graphics cards, a Rust rewrite of Wunkolo/vkfetch"
edition = "2024"
keywords = ["vulkan", "neofetch", "gpu", "fetch"]
license = "AGPL-3.0-only"
repository = "https://github.com/float3/vkfetch-rs"
version = "0.4.0"
name = "vkfetch"
categories = ["command-line-utilities"]
readme = "README.md"

[features]
default = ["linked"]
linked = ["ash/linked"]
loaded = ["ash/loaded"]

[dependencies]
ash = { version = "0.38.0", default-features = false, features = ["std"] }
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", default-features = false, features = [
    "handleapi",
    "consoleapi",
    "processenv",
    "winbase",
] }
